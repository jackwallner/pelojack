name: Sync landing page to jackwallner.com

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: sync-landing-page
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the portfolio repo
        uses: actions/checkout@v4
        with:
          repository: jackwallner/portfolio
          ssh-key: ${{ secrets.PORTFOLIO_DEPLOY_KEY }}
          path: portfolio

      - name: Mirror Pelojack's page
        run: python3 portfolio/scripts/sync_ios_pages.py pelojack

      - name: Commit and push
        working-directory: portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ios/pelojack
          if git diff --cached --quiet; then
            echo "Mirror is already current."
            exit 0
          fi
          git commit -m "chore: sync Pelojack landing page"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)."
            git pull --rebase
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
