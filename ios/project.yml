name: Pelojack
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

schemes:
  Pelojack:
    build:
      targets:
        Pelojack: all
        PelojackWatch: all
        PelojackTests: [test]
    test:
      targets:
        - PelojackTests
      config: Debug
    run:
      config: Debug
  PelojackWatch:
    build:
      targets:
        PelojackWatch: all
    run:
      config: Debug

targets:
  Pelojack:
    type: application
    platform: iOS
    sources:
      - path: Pelojack
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.pelojack
        PRODUCT_NAME: Pelojack
        INFOPLIST_FILE: Pelojack/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PelojackWatch
        embed: true

  PelojackWatch:
    type: application
    platform: watchOS
    sources:
      - path: PelojackWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.pelojack.watch
        PRODUCT_NAME: PelojackWatch
        INFOPLIST_FILE: PelojackWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: PelojackWatch/PelojackWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  PelojackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PelojackTests
    dependencies:
      - target: Pelojack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pelojack.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pelojack
        BUNDLE_LOADER: $(TEST_HOST)
